<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linux Command Flashcards</title>
<style>
:root{--bg:#eef1f6;--fg:#16203a;--mut:#5d6882;--card:#fff;--bd:#cfd6e4;--ac:#2446c9;--acfg:#fff;--back:#16203a;--backfg:#f4f6fb;--cmd:#ffd166}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--fg:#e6eaf5;--mut:#8f9bb8;--card:#172038;--bd:#2a3556;--ac:#7c97ff;--acfg:#0e1424;--back:#e6eaf5;--backfg:#16203a;--cmd:#7a4b00}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
select,input,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
input{flex:1;min-width:140px}
button{cursor:pointer}
button:hover{border-color:var(--ac)}
button.on{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.stat{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;margin-bottom:12px}
.card{min-height:260px;border-radius:14px;border:1px solid var(--bd);background:var(--card);padding:24px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;user-select:none;transition:background .2s}
.card.back{background:var(--back);color:var(--backfg);border-color:var(--back)}
.tag{font-size:.85rem;color:var(--mut)}
.card.back .tag{color:var(--backfg);opacity:.7}
#main{text-align:center;font-size:1.5rem;font-weight:600;overflow-wrap:anywhere;padding:16px 0}
#main.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:2.2rem;color:var(--ac)}
.card.back #main.mono{color:var(--cmd)}
.hint{text-align:center;color:var(--mut);font-size:.85rem;min-height:1.3em}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.nav .good{background:var(--ac);color:var(--acfg);border-color:var(--ac)}
.small{font-size:.8rem;color:var(--mut);margin-top:16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Linux command flashcards</h1>
<p class="sub">Works offline. Click the card or press Space to flip. Use the arrow keys to move.</p>
<div class="row">
<select id="cat" aria-label="Category"></select>
<input id="q" type="search" placeholder="Search commands or meanings" aria-label="Search">
</div>
<div class="row">
<button id="swap">Meaning first</button>
<button id="rev">Review only</button>
<button id="shuf">Shuffle</button>
<button id="reset">Reset progress</button>
</div>
<div class="bar"><i id="fill"></i></div>
<div class="stat"><span id="pos"></span><span id="known"></span></div>
<div id="card" class="card" tabindex="0" role="button" aria-label="Flip card">
<span class="tag" id="tag"></span>
<div id="main"></div>
<span class="hint" id="hint"></span>
</div>
<div class="nav">
<button id="prev">Previous</button>
<button id="again">Again</button>
<button id="got" class="good">Got it</button>
<button id="next">Next</button>
</div>
<p class="small">Progress is saved in your browser. Add your own commands in the RAW list inside the file, one per line as command::Category::meaning.</p>
</main>
<script>
const RAW=`pwd::Navigate::Print working directory (where am I?)
ls::Navigate::List files (-l details, -a hidden, -h readable sizes)
cd::Navigate::Change directory (cd .. up, cd ~ home, cd - previous)
tree::Navigate::Show directory tree
mkdir::Files::Make directory (-p creates nested folders)
rmdir::Files::Remove an empty directory
touch::Files::Create empty file or update its timestamp
cp::Files::Copy files (-r for folders)
mv::Files::Move or rename files
rm::Files::Remove files (-r folders, -f force, -i ask first)
ln::Files::Create links (-s symbolic link)
file::Files::Show file type
stat::Files::Show detailed file info
basename::Files::Strip directory part from a path
dirname::Files::Strip filename from a path
realpath::Files::Show absolute path
mktemp::Files::Create a temporary file
shred::Files::Securely overwrite and delete a file
cat::View::Print file contents
tac::View::Print file with last line first
less::View::Scroll through a file (q to quit)
more::View::Page through a file
head::View::Show first lines (-n 5)
tail::View::Show last lines (-f follows live)
nl::View::Number the lines of a file
wc::View::Count lines, words, bytes (-l lines)
echo::View::Print text (echo "hi" > file writes it)
printf::View::Print formatted text
rev::View::Reverse each line
grep::Search::Search text in files (-i ignore case, -r recursive, -n line numbers)
find::Search::Find files (find . -name "*.txt")
locate::Search::Fast file search by name
updatedb::Search::Update the locate database
which::Search::Show the path of a command
whereis::Search::Locate binary, source and manual of a command
type::Search::Show how a command name is interpreted
sort::Text::Sort lines (-n numeric, -r reverse)
uniq::Text::Remove adjacent duplicate lines (-c count)
cut::Text::Extract columns (cut -d"," -f1)
paste::Text::Merge lines of files side by side
join::Text::Join files on a common field
tr::Text::Translate or delete characters
sed::Text::Stream editor, find and replace (sed 's/a/b/g')
awk::Text::Pattern scanning and text processing
diff::Text::Compare files line by line
cmp::Text::Compare files byte by byte
comm::Text::Compare two sorted files
tee::Text::Write output to screen and a file
xargs::Text::Build commands from standard input
split::Text::Split a file into pieces
nano::Text::Simple terminal text editor
vi::Text::Classic text editor (vim is the improved one)
chmod::Permissions::Change permissions (chmod 755 file)
chown::Permissions::Change owner (chown user:group file)
chgrp::Permissions::Change group of a file
umask::Permissions::Set default permissions for new files
sudo::Permissions::Run a command as superuser
su::Permissions::Switch user
whoami::Users::Show current username
id::Users::Show user and group IDs
who::Users::Show who is logged in
w::Users::Show who is logged in and what they are doing
last::Users::Show login history
groups::Users::Show groups a user belongs to
useradd::Users::Create a user
usermod::Users::Modify a user
userdel::Users::Delete a user
passwd::Users::Change a password
groupadd::Users::Create a group
ps::Process::List processes (ps aux for all)
top::Process::Live process monitor
htop::Process::Friendlier interactive process viewer
kill::Process::Stop a process by PID (kill -9 forces)
killall::Process::Kill processes by name
pkill::Process::Kill processes by pattern
pgrep::Process::Find a PID by name
jobs::Process::List background jobs
bg::Process::Resume a job in the background
fg::Process::Bring a job to the foreground
nohup::Process::Keep a command running after logout
nice::Process::Run a command with a set priority
renice::Process::Change priority of a running process
watch::Process::Repeat a command every 2 seconds
sleep::Process::Pause for some seconds
time::Process::Measure how long a command takes
crontab::Process::Schedule recurring jobs
at::Process::Schedule a one-time job
systemctl::Process::Manage services (start, stop, status, enable)
service::Process::Manage services (older style)
journalctl::Process::View system logs
lsof::Process::List open files and the processes using them
uname::System::Show system info (-a for all)
hostname::System::Show or set the hostname
uptime::System::Show how long the system has been up
date::System::Show date and time
cal::System::Show a calendar
clear::System::Clear the screen
history::System::Show command history
alias::System::Create a command shortcut
unalias::System::Remove an alias
export::System::Set an environment variable
env::System::Show environment variables
source::System::Run a script in the current shell
man::System::Manual pages (man ls)
info::System::Info documentation
help::System::Help for shell builtin commands
whatis::System::One-line description of a command
apropos::System::Search manual pages by keyword
dmesg::System::Show kernel messages
lscpu::System::Show CPU info
lsblk::System::List block devices (disks)
lsusb::System::List USB devices
lspci::System::List PCI devices
free::System::Show memory usage (-h readable)
reboot::System::Restart the machine
shutdown::System::Power off or schedule it (shutdown now)
poweroff::System::Power off the machine
exit::System::Close the shell or session
bc::System::Command-line calculator
seq::System::Print a sequence of numbers
yes::System::Repeat a string forever
read::System::Read input into a variable (shell)
df::Disk::Show free disk space (-h readable)
du::Disk::Show disk usage of folders (-sh summary)
mount::Disk::Mount a filesystem
umount::Disk::Unmount a filesystem
fdisk::Disk::Partition editor
mkfs::Disk::Format a filesystem
fsck::Disk::Check and repair a filesystem
dd::Disk::Low-level copy and convert
sync::Disk::Flush data to disk
tar::Archive::Archive files (tar -czf create, tar -xzf extract)
gzip::Archive::Compress a file to .gz
gunzip::Archive::Decompress a .gz file
bzip2::Archive::Compress a file to .bz2
xz::Archive::Compress a file to .xz
zip::Archive::Create a .zip archive
unzip::Archive::Extract a .zip archive
ping::Network::Test connectivity to a host
ip::Network::Show and manage network (ip a)
ifconfig::Network::Show network interfaces (older)
netstat::Network::Show network connections (older)
ss::Network::Show socket statistics
curl::Network::Transfer data from a URL
wget::Network::Download files from the web
ssh::Network::Log in to a remote machine
scp::Network::Copy files over SSH
rsync::Network::Sync files efficiently
ftp::Network::Transfer files over FTP
telnet::Network::Connect to a remote host (unencrypted)
traceroute::Network::Trace the route to a host
nslookup::Network::Look up DNS records
dig::Network::Query DNS servers
host::Network::Simple DNS lookup
nmap::Network::Scan network ports
nc::Network::Netcat: read and write network connections
iptables::Network::Configure firewall rules
ufw::Network::Simple firewall front end
apt::Packages::Package manager for Debian/Ubuntu (apt install pkg)
apt-get::Packages::Older Debian/Ubuntu package tool
dpkg::Packages::Low-level .deb package tool
dnf::Packages::Package manager for Fedora/RHEL
yum::Packages::Older RHEL package manager
rpm::Packages::Low-level .rpm package tool
pacman::Packages::Package manager for Arch Linux
snap::Packages::Install snap packages
git::Dev::Version control
make::Dev::Build programs from a Makefile
gcc::Dev::C compiler
python3::Dev::Run the Python interpreter
|::Symbols::Pipe: send output of one command into another
>::Symbols::Redirect output to a file (overwrites)
>>::Symbols::Redirect output to a file (appends)
<::Symbols::Redirect a file into a command as input
2>::Symbols::Redirect error messages
&&::Symbols::Run next command only if the first succeeds
;::Symbols::Run commands one after another
&::Symbols::Run a command in the background
*::Symbols::Wildcard matching any characters
~::Symbols::Your home directory
.::Symbols::The current directory
..::Symbols::The parent directory
/::Symbols::The root directory`;
const ALL=RAW.trim().split("\n").map(l=>{const[c,g,d]=l.split("::");return{c,g,d}});
const $=id=>document.getElementById(id);
let cat="All",q="",swap=false,onlyRev=false,deck=[],i=0,flip=false,known={};
try{known=JSON.parse(localStorage.getItem("linux-known")||"{}")}catch(e){}
function save(){try{localStorage.setItem("linux-known",JSON.stringify(known))}catch(e){}}
["All",...new Set(ALL.map(x=>x.g))].forEach(g=>{const o=document.createElement("option");o.value=o.textContent=g;$("cat").appendChild(o)});
function build(){
deck=ALL.filter(x=>(cat==="All"||x.g===cat)&&(!q||(x.c+" "+x.d).toLowerCase().includes(q))&&(!onlyRev||!known[x.c]));
i=0;flip=false;draw();
}
function draw(){
const n=deck.length,k=ALL.filter(x=>known[x.c]).length;
$("known").textContent="Learned "+k+" of "+ALL.length;
$("fill").style.width=(k/ALL.length*100)+"%";
if(!n){$("pos").textContent="No cards";$("card").className="card";$("tag").textContent="";$("main").className="";$("main").textContent=onlyRev?"Nothing left to review here.":"No commands match your search.";$("hint").textContent="";return}
const x=deck[i],front=swap?x.d:x.c,back=swap?x.c:x.d;
$("pos").textContent="Card "+(i+1)+" of "+n;
$("card").className="card"+(flip?" back":"");
$("main").textContent=flip?back:front;
$("main").className=(flip===swap)?"mono":"";
$("tag").textContent=x.g+(known[x.c]?" (learned)":"");
$("hint").textContent=flip?"":"Click to flip";
}
function go(d){if(!deck.length)return;i=(i+d+deck.length)%deck.length;flip=false;draw()}
function mark(v){if(!deck.length)return;const c=deck[i].c;if(v)known[c]=1;else delete known[c];save();go(1)}
$("card").onclick=()=>{if(deck.length){flip=!flip;draw()}};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("got").onclick=()=>mark(true);$("again").onclick=()=>mark(false);
$("cat").onchange=e=>{cat=e.target.value;build()};
$("q").oninput=e=>{q=e.target.value.trim().toLowerCase();build()};
$("swap").onclick=e=>{swap=!swap;e.target.classList.toggle("on",swap);flip=false;draw()};
$("rev").onclick=e=>{onlyRev=!onlyRev;e.target.classList.toggle("on",onlyRev);build()};
$("shuf").onclick=()=>{for(let a=deck.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[deck[a],deck[b]]=[deck[b],deck[a]]}i=0;flip=false;draw()};
$("reset").onclick=()=>{if(confirm("Clear all learned progress?")){known={};save();build()}};
document.addEventListener("keydown",e=>{
if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
else if(e.key===" "||e.key==="Enter"){e.preventDefault();$("card").click()}
});
build();
</script>
</body>
</html>
